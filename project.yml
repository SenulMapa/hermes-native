# XcodeGen spec — generates HermesNative.xcodeproj on the macOS CI runner.
# Authored on Linux; never hand-edit a pbxproj.
name: HermesNative
options:
  bundleIdPrefix: com.senulmapa
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    # Unsigned build — AltStore re-signs on device with the user's free Apple ID.
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

packages:
  HermesGlass:
    path: Packages/HermesGlass
  HermesAPI:
    path: Packages/HermesAPI
  HermesTerminal:
    path: Packages/HermesTerminal

targets:
  HermesNative:
    type: application
    platform: iOS
    sources:
      - path: HermesNative
    dependencies:
      - package: HermesGlass
      - package: HermesAPI
      - package: HermesTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senulmapa.hermesnative
        # Auto-generate Info.plist from INFOPLIST_KEY_* build settings.
        # This keeps CFBundleVersion / CFBundleShortVersionString in sync
        # with MARKETING_VERSION / CURRENT_PROJECT_VERSION (AltStore's
        # VerificationError fires when they don't match source.json).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Hermes"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Hermes uses the microphone for voice input to your agent."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Hermes transcribes your speech on-device for voice messages."
        INFOPLIST_KEY_NSCameraUsageDescription: "Hermes uses the camera to attach photos to your messages."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Hermes attaches photos from your library to your messages."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # ATS exception: allow plain HTTP to RFC1918 / link-local / Tailscale
        # / .local hosts so the app can talk to a self-hosted Hermes server
        # that's only reachable on the LAN or the tailnet. NSAllowsLocalNetworking
        # is scoped to non-public domains per Apple's docs — public-internet
        # HTTP is still blocked. Nested plist keys via build settings use
        # INFOPLIST_KEY_<top>__<sub> (double underscore is the separator).
        INFOPLIST_KEY_NSAppTransportSecurity__NSAllowsLocalNetworking: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"

  HermesNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HermesNativeTests
    dependencies:
      - target: HermesNative
      - package: HermesAPI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.senulmapa.hermesnative.tests

schemes:
  HermesNative:
    build:
      targets:
        HermesNative: all
        HermesNativeTests: [test]
    test:
      targets:
        - HermesNativeTests
